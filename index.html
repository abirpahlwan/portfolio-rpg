  ctx.fillStyle='rgba(255,255,255,.92)';
  ell(-7,-1,5.5,wingUp);   ctx.fill(); ink(1.2);
  ell( 7,-1,5.5,wingDown); ctx.fill(); ink(1.2);
  blob(0,0,9,6.2,C.cow,1.6);
  ctx.save(); ell(0,0,9,6.2); ctx.clip();
  blob(-3.4,-1.4,3.0,2.2,C.spot,false); blob(3.2,1.8,2.4,1.8,C.spot,false);
  ctx.restore();
  blob(8.4,-1.6,4.2,3.8,C.cow,1.5);
  blob(10.0,0,2.4,1.9,C.snout,1.2);
  blob(9.4,-2.8,0.9,1.0,C.ink,false);
  rr(-4,3.6,2.6,4,1.2); fill(C.cowDk); ink(1.2);
  rr( 2,3.6,2.6,4,1.2); fill(C.cowDk); ink(1.2);
  ctx.restore();
}

function drawMinimap(){
  mmx.clearRect(0,0,mm.width,mm.height);
  const sx=mm.width/W, sy=mm.height/H;
  mmx.fillStyle='#7cc555'; mmx.fillRect(0,0,mm.width,mm.height);
  mmx.fillStyle='#4ec8e8';
  mmx.beginPath();
  mmx.ellipse(POND.cx*TILE*sx, POND.cy*TILE*sy, POND.rx*TILE*sx, POND.ry*TILE*sy,0,0,6.3);
  mmx.fill();
  for(const b of BUILDINGS){
    mmx.fillStyle=(b===insideB)? shade(b.roof,.18) : b.roof;
    mmx.fillRect(b.x*TILE*sx, b.y*TILE*sy, b.w*TILE*sx, b.h*TILE*sy);
  }
  for(const o of objs){
    mmx.fillStyle = o.seen ? 'rgba(51,36,28,.45)' : '#fff45c';
    mmx.beginPath(); mmx.arc(o.x*sx, o.y*sy, o.seen?1.4:2.2, 0, 6.3); mmx.fill();
  }
  mmx.fillStyle='#fff'; mmx.beginPath(); mmx.arc(mother.x*sx, mother.y*sy, 1.4,0,6.3); mmx.fill();
  mmx.fillStyle='#e8563f'; mmx.strokeStyle='#fff'; mmx.lineWidth=1.4;
  mmx.beginPath(); mmx.arc(P.x*sx, P.y*sy, 3,0,6.3); mmx.fill(); mmx.stroke();
}

/* the ground never changes, so it is painted once into an offscreen map */
const groundCv = document.createElement('canvas');
groundCv.width = W; groundCv.height = H;
(function bakeGround(){
  const g = groundCv.getContext('2d');
  const o = ctx; ctx = g;
  drawTerrain(0,0,MAP_W,MAP_H);
  ctx = o;
})();

function render(){
  T++;
  renderWater();
  ctx.fillStyle='#8fd465'; ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.scale(ZOOM,ZOOM);
  const cx=camX, cy=camY;
  ctx.translate(-cx,-cy);

  const vw=innerWidth/ZOOM, vh=innerHeight/ZOOM;
  const x0=Math.max(0,Math.floor(cx/TILE)-1), y0=Math.max(0,Math.floor(cy/TILE)-1);
  const x1=Math.min(MAP_W,Math.ceil((cx+vw)/TILE)+1), y1=Math.min(MAP_H,Math.ceil((cy+vh)/TILE)+1);

  const bx=x0*TILE, by=y0*TILE, bw=(x1-x0)*TILE, bh=(y1-y0)*TILE;
  ctx.drawImage(groundCv, bx,by,bw,bh, bx,by,bw,bh);
  ctx.drawImage(wcv, 0,0,WPW,WPH, WX0*TILE, WY0*TILE, WPW*WSC, WPH*WSC);
  BUILDINGS.forEach(drawFacade);

  const d=[];
  for(const t of TREES){
    if(t.x<bx-24||t.x>bx+bw+24||t.y<by-30||t.y>by+bh+24) continue;
    d.push({z:t.y+15, f:()=>drawTree(t)});
  }
  for(const o of objs){
    if(o.home && o.home.a>0.85) continue;
    d.push({z:o.y+o.ph, f:()=>drawObj(o)});
  }
  for(const p of PROPS) d.push({z:p.y+16, f:()=>drawProp(p)});
  for(const r of REEDS){
    if(r.x<cx-20||r.x>cx+vw+20||r.y<cy-40||r.y>cy+vh+20) continue;   // cull offscreen
    d.push({z:r.y, f:()=>drawReed(r)});
  }
  for(const c of cows)  d.push({z:c.y+7,  f:()=>drawCow(c)});
  d.push({z:mother.y+4, f:()=>{ ducklings.forEach(k=>drawDuck(k,false)); drawDuck(mother,true); }});
  for(const b of BUILDINGS) d.push({z:(b.y+b.h-1)*TILE, f:()=>drawRoof(b)});
  d.push({z:P.y+6, f:drawPlayer});
  d.push({z:1e9, f:()=>{ drawConfetti(); drawBubble(); }});   // always on top of the world
  d.sort((a,b)=>a.z-b.z).forEach(k=>k.f());

  /* bouncing arrows over doors you haven't opened */
  for(const b of BUILDINGS){
    if(b._entered) continue;
    const dx=b.door*TILE+TILE/2, fy=(b.y+b.h-1)*TILE;
    const bob=Math.sin(T/14+b.x)*2.2;
    ctx.save(); ctx.translate(dx, fy-20+bob);
    ctx.beginPath();
    ctx.moveTo(-4.5,-4); ctx.lineTo(4.5,-4); ctx.lineTo(0,4); ctx.closePath();
    fill('#ffd23f'); ink(1.5);
    ctx.restore();
  }

  drawButterflies();
  drawCloudShadows(cx, cy, vw, vh);
  ctx.restore();
  drawFlyingCow();
  drawMinimap();
}

/* the little guy in the panel header — same art as the world sprite */
const avCv = document.getElementById('avatar');
const avCtx = avCv.getContext('2d');
let avT = 0;
function drawAvatar(){
  avT++;
  const o = ctx; ctx = avCtx;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,200,200);
  ctx.save();
  ctx.translate(100, 140);
  ctx.scale(5.3, 5.3);

  const bob   = Math.sin(avT/26)*0.5;
  const sway  = Math.sin(avT/38)*0.05;
  const blink = (avT%190)<9;
  /* when he has nothing to demonstrate he just waves now and then */
  let pose = avatarPose;
  if(pose==='idle') pose = (avT%420) > 380 ? 'wave' : 'wave2';

  ctx.translate(0, bob); ctx.rotate(sway);
  drop(0, 9.5, 6.2, 2.2, .16);
  if(pose==='wave2') paintHero(2, 0, blink, 'nothing', avT);
  else               paintHero(2, 0, blink, pose, avT);
  ctx.restore();
  ctx = o;
}

function loop(){
  update();
  render();
  if(modal.classList.contains('on')) drawAvatar();
  requestAnimationFrame(loop);
}

/* ==================================================================
   4.  UI
   ================================================================== */
const modal = document.getElementById('modal');

/* which little performance he gives in each panel */
const POSE_BY_ID = {
  about:'wave',
  c1:'controller', c2:'controller', c3:'controller', c4:'controller', c5:'controller',
  m1:'controller', m2:'controller', m3:'controller', m4:'controller',
  systems:'laptop', craft:'wrench', exp:'marker', side:'trophy',
  xr:'vr', ar:'tablet', brand:'tablet', contact:'envelope', cow:'wave'
};
let avatarPose = 'idle';
function openModal(title, tag, html, pose){
  avatarPose = pose || 'idle'; avT = 0;
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mTag').textContent=tag||'';
  document.getElementById('mBody').innerHTML=html;
  modal.classList.add('on'); blip(660);
}
function closeModal(){
  modal.classList.remove('on');
  if(pendingCongrats) setTimeout(showCongrats, 320);
}
modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });

let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('on'), 1900);
}

function tryInteract(){
  if(modal.classList.contains('on')){ closeModal(); return; }
  if(document.getElementById('intro').style.display!=='none') return;
  if(!near) return;
  const first = !near.seen;
  near.seen=true; updateFound();
  if(first) track('panel:'+near.id);
  openModal(near.title, near.tag, near.html, POSE_BY_ID[near.id]);
}
let pendingCongrats = false;
function updateFound(){
  const total = objs.filter(o=>!o.secret).length;
  const got   = objs.filter(o=>!o.secret && o.seen).length;
  const sTot  = objs.filter(o=>o.secret).length;
  const sGot  = objs.filter(o=>o.secret && o.seen).length;

  const el = document.getElementById('found');
  el.textContent = `Discovered ${got} / ${total}` + (got===total ? '  \u2713' : '');
  if(got===total) el.style.color = 'var(--good)';

  const sl = document.getElementById('secretsLine');
  if(sGot > 0){
    sl.style.display = 'block';
    sl.textContent = `Secrets ${sGot} / ${sTot}` + (sGot===sTot ? '  \u2713' : '');
  }

  if(got===total && !updateFound._done){
    updateFound._done = true;
    track('found-everything');
    pendingCongrats = true;                    // wait until they close the last panel
  }
}

function showCongrats(){
  pendingCongrats = false;
  const sTot = objs.filter(o=>o.secret).length;
  const sGot = objs.filter(o=>o.secret && o.seen).length;
  const mins = Math.max(1, Math.round((Date.now() - startedAt)/60000));
  const secretLine = sGot === sTot
    ? `<p><b>And every hidden thing, too.</b> The cow, the football, the tea, the toys, the
       chess game, the cricket bat and the rickshaw \u2014 all ${sTot} of them.</p>`
    : `<p>You also found <b>${sGot} of ${sTot}</b> hidden things scattered around the village.
       ${sGot === 0 ? 'There are seven of them, and they are the ones that say something about me rather than about the work.'
                    : 'The rest are still out there.'}</p>`;
  avatarPose = 'trophy'; avT = 0;
  openModal('You found everything', 'the whole village',
    `<p style="font-size:30px;margin:0 0 12px">&#127881;</p>
     <p>That's all ${objs.filter(o=>!o.secret).length} of them \u2014 every building, every cabinet,
     every panel \u2014 in about ${mins} minute${mins>1?'s':''}. Thank you for actually playing it.</p>
     ${secretLine}
     <p>Everything you just walked through is also here as a plain page, if you want to reread it,
     copy something out of it, or send it to someone who would rather not use a joystick.</p>
     <p style="margin-top:18px">
       <button class="cbtn" onclick="goPlain()">Read the plain version &rarr;</button>
       <button class="cbtn ghost" onclick="closeModal()">Keep wandering</button>
     </p>`, 'trophy');
  blip(880); setTimeout(()=>blip(1180), 130); setTimeout(()=>blip(1480), 260);
  confettiUntil = T + 240;
}
function goPlain(){ closeModal(); toggleClassic(true); track('congrats:to-plain'); }
const startedAt = Date.now();

let audio=null, soundOn=true;
function blip(freq){
  if(!soundOn) return;
  try{
    audio = audio || new (window.AudioContext||window.webkitAudioContext)();
    const o=audio.createOscillator(), g=audio.createGain();
    o.type='square'; o.frequency.value=freq; g.gain.value=0.03;
    o.connect(g); g.connect(audio.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime+0.12);
    o.stop(audio.currentTime+0.13);
  }catch(e){}
}

const CONTACT_EMAIL = 'abirpahlwan@gmail.com';
function sendMail(e){
  if(e) e.preventDefault();
  const s = document.getElementById('cSubject');
  const b = document.getElementById('cBody');
  const subject = s && s.value ? s.value.trim() : '';
  const body = b && b.value ? b.value.trim() : '';
  const url = 'mailto:' + CONTACT_EMAIL
    + '?subject=' + encodeURIComponent(subject)
    + '&body=' + encodeURIComponent(body);
  try{ track('contact:mailto'); }catch(err){}
  window.location.href = url;
}
function copyEmail(btn){
  const done = ()=>{
    if(btn){
      const t = btn.textContent;
      btn.textContent = 'Copied ✓';
      setTimeout(()=>{ btn.textContent = t; }, 1600);
    } else toast('Copied ' + CONTACT_EMAIL);
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(CONTACT_EMAIL).then(done, ()=>fallbackCopy(done));
    } else fallbackCopy(done);
  }catch(err){ fallbackCopy(done); }
}
function fallbackCopy(done){
  try{
    const ta = document.createElement('textarea');
    ta.value = CONTACT_EMAIL;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    done();
  }catch(err){ window.prompt('Copy this address:', CONTACT_EMAIL); }
}

function buildClassic(){
  document.getElementById('cName').textContent=CONTENT.name;
  document.getElementById('cRole').textContent=CONTENT.role;
  document.getElementById('cBlurb').textContent=CONTENT.blurb;
  const host=document.getElementById('cSections'); host.innerHTML='';
  CONTENT.objects.filter(o=>!o.secret).forEach(o=>{
    const s=document.createElement('section'); s.className='sec';
    s.innerHTML=`<h2>${o.title}</h2><div class="card-body">${o.html}</div>`;
    host.appendChild(s);
  });
}
function toggleClassic(force){
  const c=document.getElementById('classic');
  const on = force!==undefined ? force : !c.classList.contains('on');
  c.classList.toggle('on', on);
  document.getElementById('hud').style.display = on ? 'none' : 'block';
  if(on){ closeModal(); document.getElementById('intro').style.display='none'; c.scrollTop=0;
          track('skip-to-plain-version'); }
}

document.getElementById('whoami').textContent    = CONTENT.name;
document.getElementById('introName').textContent = CONTENT.name;
document.getElementById('introSub').textContent  = CONTENT.tagline;
document.getElementById('btnClassic').onclick    = ()=>toggleClassic(true);
document.getElementById('lnkClassic').onclick    = e=>{e.preventDefault(); toggleClassic(true);};
document.getElementById('btnBackGame').onclick   = ()=>toggleClassic(false);
document.getElementById('btnSound').onclick      = e=>{ soundOn=!soundOn; e.target.textContent=soundOn?'♪ on':'♪ off'; };
document.getElementById('btnHelp').onclick       = ()=>openModal('How to explore','controls',
  `<ul>
     <li><b>Move</b> — WASD or arrow keys (drag the on-screen stick on mobile)</li>
     <li><b>Go inside</b> — walk through a lit doorway; the roof lifts off</li>
     <li><b>Interact</b> — stand by something glowing and press <b>E</b> / <b>Space</b></li>
     <li><b>Close</b> — <b>Esc</b>, or click outside the panel</li>
     <li><b>Plain version</b> — press <b>M</b> or hit "Skip the game"</li>
   </ul>
   <p>Eight buildings and ${objs.filter(o=>!o.secret).length} things to read. There are also
   <b>${objs.filter(o=>o.secret).length} hidden things</b> out in the village that say more about me
   than about the work \u2014 they glimmer faintly, so keep an eye on the grass.</p>`, 'wave');
const spd=document.getElementById('spd'), spdVal=document.getElementById('spdVal');
function setSpeed(v){ P.speed=parseFloat(v); spdVal.textContent=P.speed.toFixed(1)+'\u00d7'; }
spd.addEventListener('input', e=>setSpeed(e.target.value));
setSpeed(spd.value);
/* keep the keyboard on the game, not the slider */
spd.addEventListener('keydown', e=>e.preventDefault());
spd.addEventListener('change', ()=>spd.blur());

document.getElementById('btnStart').onclick = ()=>{
  document.getElementById('intro').style.display='none';
  toast('Walk through a doorway to go inside'); blip(880);
  track('start-playing');
};

/* ------------------------------------------------------------------
   Touch controls.

   The stick is "floating": put a finger down anywhere on the left side of
   the screen and the stick jumps to that spot, so you never have to look
   for it. Touches are tracked by identifier, so you can steer and tap LOOK
   at the same time.
   ------------------------------------------------------------------ */
const stick = document.getElementById('stick');
const nub   = document.getElementById('nub');
const abtn  = document.getElementById('abtn');
const STICK_MAX = 46;
let stickId = null, sc = {x:0, y:0}, homeStick = true;

function isUiTarget(t){
  return !!(t && t.closest && t.closest('button, a, input, textarea, select, #modal, #classic'));
}
function placeStick(x, y){
  stick.style.left = (x - 62) + 'px';
  stick.style.top  = (y - 62) + 'px';
  stick.style.bottom = 'auto';
  stick.classList.add('live');
  homeStick = false;
}
function restStick(){
  stick.style.left = '26px';
  stick.style.top = 'auto';
  stick.style.bottom = '26px';
  stick.classList.remove('live');
  nub.style.transform = '';
  homeStick = true;
}
function applyStick(t){
  let dx = t.clientX - sc.x, dy = t.clientY - sc.y;
  const d = Math.hypot(dx, dy);
  if(d > STICK_MAX){ dx = dx/d*STICK_MAX; dy = dy/d*STICK_MAX; }
  nub.style.transform = `translate(${dx}px,${dy}px)`;
  touchVec = {x: dx/STICK_MAX, y: dy/STICK_MAX};
}

addEventListener('touchstart', e=>{
  if(!matchMedia('(pointer:coarse)').matches) return;
  for(const t of e.changedTouches){
    if(isUiTarget(t.target)) continue;                 // buttons and panels keep their taps
    if(stickId !== null) continue;
    if(t.clientX > innerWidth*0.58) continue;          // right side is for LOOK
    if(t.clientY < 96) continue;                       // keep clear of the HUD
    stickId = t.identifier;
    placeStick(t.clientX, t.clientY);
    sc = {x: t.clientX, y: t.clientY};
    applyStick(t);
  }
}, {passive:true});

addEventListener('touchmove', e=>{
  if(stickId === null) return;
  for(const t of e.changedTouches){
    if(t.identifier !== stickId) continue;
    applyStick(t);
  }
}, {passive:true});

function endStick(e){
  if(stickId === null) return;
  for(const t of e.changedTouches){
    if(t.identifier !== stickId) continue;
    stickId = null;
    touchVec = {x:0, y:0};
    restStick();
  }
}
addEventListener('touchend', endStick, {passive:true});
addEventListener('touchcancel', endStick, {passive:true});

/* LOOK: fire on touchstart so it feels instant, and don't let the same tap
   also count as a click afterwards. */
let lookLock = 0;
function pressLook(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  const now = Date.now();
  if(now - lookLock < 250) return;
  lookLock = now;
  abtn.style.transform = 'translateY(3px)';
  setTimeout(()=>{ abtn.style.transform=''; }, 120);
  if(navigator.vibrate) { try{ navigator.vibrate(12); }catch(err){} }
  tryInteract();
}
abtn.addEventListener('touchstart', pressLook, {passive:false});
abtn.addEventListener('click', e=>{
  if(Date.now() - lookLock < 400) return;   // already handled by the touch
  pressLook(e);
});

/* tapping the dimmed area outside a panel closes it on touch too */
modal.addEventListener('touchstart', e=>{
  if(e.target === modal) closeModal();
}, {passive:true});

buildClassic();
updateFound();
resize();
loop();
</script>
